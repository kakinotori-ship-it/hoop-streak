<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b8a6e8">
<title>Hoop Streak</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f8f6fc;--card:#fff;--text:#34313d;--muted:#8b8795;--accent:#9b86d8;--accent2:#d8cff4;--green:#8bc6a2}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.app{max-width:520px;margin:auto;padding:20px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:25px;margin:0}.streak{background:#fff;border-radius:18px;padding:10px 14px;font-weight:700;box-shadow:0 3px 15px #00000008}
.card{background:var(--card);border-radius:24px;padding:20px;margin:12px 0;box-shadow:0 5px 22px #00000008}
.hero{text-align:center;background:linear-gradient(145deg,#eee9fb,#fff)}
.flame{font-size:46px}.big{font-size:42px;font-weight:800;margin:2px 0}
button{border:0;border-radius:16px;padding:13px 17px;background:var(--accent);color:white;font-size:16px;font-weight:700;cursor:pointer}
button.secondary{background:#eeeaf7;color:#5f527e}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
input{width:100%;padding:13px;border:1px solid #e6e2ed;border-radius:14px;font-size:16px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;gap:8px;padding:10px max(10px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px #0000000b;z-index:5}
.tabs button{background:transparent;color:var(--muted);font-size:12px;padding:8px 13px}.tabs button.active{color:var(--accent)}
.page{display:none}.page.active{display:block}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{font-size:11px;text-align:center;color:var(--muted);padding-bottom:3px}.day{min-height:52px;border-radius:13px;background:#faf9fc;text-align:center;padding:6px 2px;font-size:12px;position:relative}.day .dot{display:block;margin:4px auto 0;width:22px;height:22px;border-radius:50%;background:#e7e3ee}.day.done .dot{background:var(--green);color:white}.day.today{outline:2px solid var(--accent)}.mins{font-size:9px;color:#6e6879}
canvas{width:100%;height:auto;display:block}
.weight-screen{margin:-20px -16px 0}
.weight-toolbar{height:76px;background:#fff;display:flex;justify-content:center;align-items:center;gap:10px;box-shadow:0 3px 12px #0000000b;position:relative;z-index:2}
.weight-title,.weight-add{background:#fff;color:#e68a62;border:2px solid #d4d4d4;border-radius:14px;padding:10px 15px;font-size:18px;font-weight:500}
.weight-title{min-width:184px}.weight-add{font-size:28px;line-height:1;padding:7px 17px}
.weight-dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#72c9c9;margin-right:7px}
.weight-chevron{color:#999;font-size:14px;margin-left:4px}
.weight-chart-card{background:#fff;padding:14px 0 16px;overflow:hidden}
.weight-latest{position:absolute;left:28px;margin-top:8px;font-size:19px;font-weight:700;color:#555;z-index:1}
.weight-latest span:first-child{font-size:26px}
.weight-ranges{display:flex;justify-content:space-around;align-items:center;padding:12px 8px 4px}
.weight-ranges button{background:transparent;color:#222;font-size:15px;padding:9px 11px;border-radius:11px}
.weight-ranges button.active{background:#62666a;color:#fff}
.weight-entry-card{margin-top:12px}
@media(max-width:390px){.weight-ranges button{font-size:13px;padding:8px 7px}.weight-title{min-width:165px}}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.badge{padding:14px;border-radius:18px;background:#f5f2fb}.badge.lock{opacity:.45}
small,.muted{color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<header><h1>🌀 Hoop Streak</h1><div class="streak">📊 <span id="streak">0</span>日</div></header>

<section id="home" class="page active">
<div class="card hero"><div class="flame">🔥</div><div class="big" id="todayMin">0</div><div>今日のフラフープ（分）</div><br><button onclick="addSession()">＋ 記録を追加</button></div>
<div class="card"><b>🎯 今日の目標</b><p><span id="goalNow">0</span> / <span id="goal">20</span> 分</p><div style="height:12px;background:#eeeaf5;border-radius:99px"><div id="progress" style="height:100%;width:0%;background:var(--accent);border-radius:99px"></div></div></div>
<div class="card"><b>📊 今月</b><p>合計 <strong id="monthMin">0</strong> 分　・　運動日 <strong id="monthDays">0</strong> 日</p></div>
</section>

<section id="calendar" class="page">
<div class="card"><div class="row"><button class="secondary" onclick="changeMonth(-1)">‹</button><h2 id="monthTitle" style="text-align:center;margin:0"></h2><button class="secondary" onclick="changeMonth(1)">›</button></div><br><div class="calendar" id="cal"></div></div>
</section>

<section id="weight" class="page">
<div class="weight-screen">
  <div class="weight-toolbar">
    <button class="weight-title" onclick="cycleWeightRange()"><span class="weight-dot"></span>体重 <span class="weight-chevron">▼</span></button>
    <button class="weight-add" onclick="focusWeightInput()">＋</button>
  </div>

  <div class="weight-chart-card">
    <div class="weight-latest"><span id="latestWeight">--</span><span> kg</span></div>
    <canvas id="chart" width="760" height="430"></canvas>
    <div class="weight-ranges">
      <button data-range="7d" onclick="setWeightRange('7d')">1週間</button>
      <button data-range="1m" onclick="setWeightRange('1m')">1ヶ月</button>
      <button data-range="3m" onclick="setWeightRange('3m')">3ヶ月</button>
      <button data-range="6m" onclick="setWeightRange('6m')">半年</button>
      <button data-range="1y" onclick="setWeightRange('1y')">1年</button>
    </div>
  </div>

  <div class="card weight-entry-card">
    <div class="row"><input id="weightInput" type="number" step="0.1" placeholder="体重（kg）"><button onclick="saveWeight()">記録</button></div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px">📋 体重の記録</h3>
    <div id="weightList"></div>
  </div>
</div>
</section>

<section id="badges" class="page">
<div class="card"><h2>📊 累計記録</h2>
<p>累計運動日数：<strong id="totalDays">0</strong>日</p>
<p>累計フラフープ：<strong id="total">0</strong>分</p>
<p>1運動日あたり：<strong id="avgMinutes">0</strong>分</p>
<div class="badges" id="badgeList"></div></div>
</section>

<section id="settings" class="page">
<div class="card"><h2>⚙️ 設定</h2><label>1日の目標（分）</label><br><br><div class="row"><input id="goalInput" type="number" min="1"><button onclick="saveGoal()">保存</button></div><hr style="border:0;border-top:1px solid #eee;margin:22px 0"><p><b>🔔 リマインダー</b></p><p class="muted">iPhoneのホーム画面に追加して使うと、通知機能を拡張できます。現在の版では、記録を促すための設定欄を用意しています。</p><button class="secondary" onclick="exportData()">データを書き出す</button></div>
</section>
</div>

<nav class="tabs">
<button onclick="show('home')" id="t-home">🏠<br>ホーム</button>
<button onclick="show('calendar')" id="t-calendar">📅<br>カレンダー</button>
<button onclick="show('weight')" id="t-weight">⚖️<br>体重</button>
<button onclick="show('badges')" id="t-badges">🏆<br>実績</button>
<button onclick="show('settings')" id="t-settings">⚙️<br>設定</button>
</nav>

<script>
const KEY='hoopStreakV1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"sessions":{},"weights":{},"goal":20}');
let view=new Date();
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function addSession(){
 const d=new Date(), k=key(d);
 const v=prompt('フラフープを何分しましたか？','10');
 if(v===null)return; const m=Number(v); if(!Number.isFinite(m)||m<=0)return alert('1分以上の数字を入力してね。');
 data.sessions[k]=(data.sessions[k]||0)+m; save(); render();
}
function saveWeight(){const v=Number(weightInput.value);if(v>0){data.weights[key(new Date())]=v;weightInput.value='';save();render()}}
function saveGoal(){const v=Number(goalInput.value);if(v>0){data.goal=v;save();render()}}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hoop-streak-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.getElementById('t-'+id).classList.add('active');render()}
function calcStreak(){let d=new Date();let s=0;while(data.sessions[key(d)]>0){s++;d.setDate(d.getDate()-1)}return s}
function bestStreak(){let ks=Object.keys(data.sessions).filter(k=>data.sessions[k]>0).sort(),best=0,cur=0,prev=null;for(const k of ks){const d=new Date(k+'T12:00:00');if(prev){const diff=(d-prev)/86400000;if(diff!==1)cur=0}cur++;best=Math.max(best,cur);prev=d}return best}
function renderCalendar(){
 const y=view.getFullYear(),m=view.getMonth(); monthTitle.textContent=`${y}年${m+1}月`;cal.innerHTML=['日','月','火','水','木','金','土'].map(x=>`<div class="dow">${x}</div>`).join('');
 const first=new Date(y,m,1).getDay(), last=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)cal.innerHTML+='<div></div>';
 for(let n=1;n<=last;n++){const d=new Date(y,m,n),k=key(d),mins=data.sessions[k]||0;cal.innerHTML+=`<div class="day ${mins?'done':''} ${k===key(new Date())?'today':''}" onclick="alert('${y}/${m+1}/${n}\\nフラフープ：${mins}分')">${n}<span class="dot">${mins?'✓':''}</span>${mins?`<span class="mins">${mins}分</span>`:''}</div>`}
}
function changeMonth(n){view.setMonth(view.getMonth()+n);renderCalendar()}
let weightRange='6m';

function focusWeightInput(){
  document.getElementById('weightInput').focus();
  document.getElementById('weightInput').scrollIntoView({behavior:'smooth',block:'center'});
}

function setWeightRange(r){
  weightRange=r;
  document.querySelectorAll('.weight-ranges button').forEach(b=>b.classList.toggle('active',b.dataset.range===r));
  drawChart();
}

function cycleWeightRange(){
  const rs=['7d','1m','3m','6m','1y'];
  setWeightRange(rs[(rs.indexOf(weightRange)+1)%rs.length]);
}

function rangeStart(range){
  const d=new Date();
  if(range==='7d') d.setDate(d.getDate()-6);
  if(range==='1m') d.setMonth(d.getMonth()-1);
  if(range==='3m') d.setMonth(d.getMonth()-3);
  if(range==='6m') d.setMonth(d.getMonth()-6);
  if(range==='1y') d.setFullYear(d.getFullYear()-1);
  d.setHours(0,0,0,0);
  return d;
}

function fmtDate(k){
  const [y,m,d]=k.split('-').map(Number);
  return `${m}/${d}`;
}

function drawChart(){
  const c=document.getElementById('chart'), ctx=c.getContext('2d');
  const rect=c.getBoundingClientRect(), cssW=Math.max(320,rect.width), cssH=430;
  const dpr=window.devicePixelRatio||1;
  c.width=Math.round(cssW*dpr); c.height=Math.round(cssH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);

  const start=rangeStart(weightRange);
  const endDate=new Date(); endDate.setHours(23,59,59,999);
  const all=Object.entries(data.weights).sort((a,b)=>a[0].localeCompare(b[0]));
  const arr=all.filter(([k])=>{
    const d=new Date(k+'T12:00:00');
    return d>=start && d<=endDate;
  });

  const left=64,right=10,top=34,bottom=66;
  const pw=cssW-left-right, ph=cssH-top-bottom;

  if(!arr.length){
    ctx.fillStyle='#999';
    ctx.font='16px -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif';
    ctx.textAlign='center';
    ctx.fillText('この期間の体重記録はありません',cssW/2,cssH/2);
    ctx.textAlign='left';
    return;
  }

  const vals=arr.map(x=>Number(x[1]));
  let min=Math.min(...vals), max=Math.max(...vals);
  const pad=Math.max(0.5,(max-min)*0.18);
  min=Math.floor((min-pad)*4)/4;
  max=Math.ceil((max+pad)*4)/4;
  if(max-min<1) { max=min+1; }

  // Grid and y-axis labels.
  const steps=5;
  ctx.font='13px -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif';
  ctx.textAlign='right';
  for(let i=0;i<=steps;i++){
    const v=min+(max-min)*i/steps;
    const y=top+ph-(ph*i/steps);
    ctx.strokeStyle='#e8e8e8';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(cssW-right,y);ctx.stroke();
    ctx.fillStyle='#666';
    ctx.fillText(v.toFixed(2),left-8,y+4);
  }

  const t0=start.getTime(), t1=endDate.getTime();
  const xFor=k=>left+((new Date(k+'T12:00:00').getTime()-t0)/(t1-t0))*pw;
  const yFor=v=>top+ph-((v-min)/(max-min))*ph;

  // X-axis labels.
  ctx.textAlign='center';
  ctx.fillStyle='#555';
  const labels=[];
  if(weightRange==='7d'){
    for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);labels.push(d);}
  }else{
    labels.push(start,new Date((start.getTime()+endDate.getTime())/2),new Date());
  }
  labels.forEach(d=>{
    const x=left+((d.getTime()-t0)/(t1-t0))*pw;
    ctx.fillText(`${d.getMonth()+1}月`,x,cssH-39);
    ctx.fillText(`${d.getFullYear()}年`,x,cssH-20);
  });

  // Line and points.
  ctx.strokeStyle='#73c9c9';
  ctx.lineWidth=4;
  ctx.lineJoin='round';
  ctx.lineCap='round';
  ctx.beginPath();
  arr.forEach(([k,v],i)=>{
    const x=xFor(k),y=yFor(Number(v));
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.stroke();

  arr.forEach(([k,v])=>{
    const x=xFor(k),y=yFor(Number(v));
    ctx.fillStyle='#73c9c9';
    ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();
  });

  // Latest value.
  const latest=arr[arr.length-1];
  ctx.fillStyle='#555';
  ctx.font='700 18px -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif';
  ctx.textAlign='left';
  ctx.fillText(`${latest[1]} kg`,left,22);

  document.querySelectorAll('.weight-ranges button').forEach(b=>b.classList.toggle('active',b.dataset.range===weightRange));
}

function renderWeightList(){
 const list=document.getElementById('weightList');
 const arr=Object.entries(data.weights).sort((a,b)=>b[0].localeCompare(a[0]));
 if(!arr.length){list.innerHTML='<p class="muted" style="margin:0">まだ体重の記録がありません。</p>';return}
 list.innerHTML=arr.map(([k,v])=>{
   const [y,m,d]=k.split('-');
   return `<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-top:1px solid #eee"><span>${y}/${Number(m)}/${Number(d)}</span><strong style="font-size:18px">${v} kg</strong></div>`;
 }).join('');
}

function render(){
 const today=data.sessions[key(new Date())]||0;todayMin.textContent=today;goal.textContent=data.goal;goalNow.textContent=today;progress.style.width=Math.min(100,today/data.goal*100)+'%';
 const sessionValues=Object.values(data.sessions);const totalDays=sessionValues.filter(v=>v>0).length;const totalMinutes=sessionValues.reduce((a,b)=>a+b,0);streak.textContent=totalDays;total.textContent=totalMinutes;document.getElementById('totalDays').textContent=totalDays;document.getElementById('avgMinutes').textContent=totalDays?(totalMinutes/totalDays).toFixed(1):'0';
 const now=new Date();const pref=`${now.getFullYear()}-${pad(now.getMonth()+1)}`;const ms=Object.entries(data.sessions).filter(([k,v])=>k.startsWith(pref));monthMin.textContent=ms.reduce((a,[k,v])=>a+v,0);monthDays.textContent=ms.filter(([k,v])=>v>0).length;goalInput.value=data.goal;
 const ws=Object.entries(data.weights).sort((a,b)=>a[0].localeCompare(b[0]));latestWeight.textContent=ws.length?ws.at(-1)[1]:'--';drawChart();renderWeightList();renderCalendar();
 const b=[1,7,10,20,30,50,100,200,365].map(n=>`<div class="badge ${totalDays<n?'lock':''}">${totalDays>=n?'🏆':'🔒'} <b>${n}日</b><br><small>${totalDays>=n?'達成！':'あと '+(n-totalDays)+'日'}</small></div>`).join('');badgeList.innerHTML=b;
}
render();setWeightRange('6m');show('home');
</script>
</body></html>
